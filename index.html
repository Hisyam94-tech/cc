    <style>
        *{box-sizing:border-box}
        html{width:100%;min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
        body{font-family:'DM Sans',sans-serif;background:#f5f7fa;width:100%;min-height:100%;margin:0;overflow-x:hidden;overscroll-behavior-x:none}
        button,input,select,textarea{touch-action:manipulation}
        .sidebar-wrapper{position:fixed;top:0;left:0;bottom:0;z-index:40;width:56px;overflow:hidden;transition:width 0.25s cubic-bezier(0.4,0,0.2,1)}
        .sidebar-wrapper.expanded{width:240px}
        .sidebar-panel{position:absolute;left:0;top:0;bottom:0;width:240px;background:#fff;border-right:1px solid #e2e8f0;box-shadow:4px 0 20px rgba(0,0,0,0.07);display:flex;flex-direction:column;overflow:hidden}
        .sidebar-panel .nav-label,.sidebar-panel .sidebar-title,.sidebar-panel .sidebar-subtitle,.sidebar-panel .quick-actions,.sidebar-panel .version-info{opacity:0;transition:opacity 0.08s ease;pointer-events:none;user-select:none}
        .sidebar-wrapper.expanded .sidebar-panel .nav-label,.sidebar-wrapper.expanded .sidebar-panel .sidebar-title,.sidebar-wrapper.expanded .sidebar-panel .sidebar-subtitle,.sidebar-wrapper.expanded .sidebar-panel .quick-actions,.sidebar-wrapper.expanded .sidebar-panel .version-info{opacity:1;transition:opacity 0.18s ease 0.12s;pointer-events:auto}
        .sidebar-header{display:flex;align-items:center;gap:12px;padding:0 10px;height:64px;border-bottom:1px solid #f1f5f9;flex-shrink:0;overflow:hidden}
        .sidebar-logo{width:36px;height:36px;min-width:36px;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .main-content{transition:margin-left 0.25s cubic-bezier(0.4,0,0.2,1);min-height:100vh}
        @media(min-width:768px){.main-content.sidebar-collapsed{margin-left:56px}.main-content.sidebar-expanded{margin-left:240px}}
        .nav-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;transition:all 0.15s ease;white-space:nowrap;overflow:hidden;color:#64748b;text-decoration:none;position:relative;width:100%;text-align:left;border:none;background:transparent}
        .nav-item:hover{background:#f1f5f9;color:#1e293b}
        .nav-item.active{background:#eff6ff;color:#2563eb}
        .nav-icon{flex-shrink:0;width:30px;height:30px;margin:0 2px}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:#f8fafc}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
        ::-webkit-scrollbar-thumb:hover{background:#94a3b8}
        .smart-dropdown{position:relative}
        .smart-dropdown-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.12);max-height:220px;overflow-y:auto;z-index:9999}
        .smart-dropdown-item{padding:9px 14px;cursor:pointer;font-size:14px;color:#334155;transition:background 0.1s;display:flex;align-items:center;gap:8px}
        .smart-dropdown-item:hover{background:#f1f5f9}
        .smart-dropdown-item.add-new{color:#2563eb;font-weight:600;border-top:1px solid #e2e8f0;position:sticky;bottom:0;background:#fff}
        .smart-dropdown-item.add-new:hover{background:#eff6ff}
        .stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px;transition:all 0.2s ease;cursor:pointer}
        .stat-card:hover{border-color:#93c5fd;box-shadow:0 4px 20px rgba(37,99,235,0.1);transform:translateY(-2px)}
        .dashboard-stats-grid{grid-template-columns:repeat(3,minmax(0,1fr)) !important}
        .data-table{width:100%;border-collapse:collapse}

        .data-table td{padding:13px 16px;border-bottom:1px solid #f1f5f9;font-size:14px;color:#334155}
        .data-table tbody tr:hover{background:#fafbfc}

        .form-input{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:14px;font-family:'DM Sans',sans-serif;background:#fff;color:#1e293b;transition:all 0.15s ease;outline:none}

        .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9000;animation:fadeIn 0.2s ease}
        .modal-box{background:#fff;border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,0.15);padding:0;width:100%;max-width:860px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:slideIn 0.25s ease}
        .modal-header{position:relative;z-index:20;margin:0;padding:20px 28px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-bottom:1px solid #1d4ed8;flex:0 0 auto;width:100%}
        .modal-body{padding:24px 28px 28px;overflow-x:hidden;overflow-y:auto;min-height:0;overscroll-behavior:none}

        .page-header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
        /* CircuitCare blue-gradient theme */
        .main-content{background:linear-gradient(145deg,#eff6ff 0%,#f8fbff 48%,#dbeafe 100%)}
        .sidebar-header,.mobile-sidebar-header{background:linear-gradient(135deg,#0f3d91 0%,#2563eb 65%,#38bdf8 100%);border-bottom-color:#60a5fa !important}
        .sidebar-header .sidebar-title>div,.sidebar-header .sidebar-subtitle,.mobile-sidebar-header>div>div{color:#fff !important}
        .sidebar-header .sidebar-logo,.mobile-sidebar-header>div:first-child{background:rgba(255,255,255,.92)}
        .mobile-sidebar-header>button,.mobile-sidebar-header>button svg{color:#fff !important}
        .page-header{background:linear-gradient(135deg,#0f766e 0%,#0891b2 58%,#22d3ee 100%);border-bottom-color:#67e8f9;box-shadow:0 6px 22px rgba(8,145,178,.2)}
        .page-header h1,.page-header p{color:#fff !important}
        .page-header p{opacity:.82}
        .btn-primary{background:linear-gradient(135deg,#2563eb,#0ea5e9);box-shadow:0 5px 14px rgba(37,99,235,.22)}
        .btn-primary:hover{background:linear-gradient(135deg,#1d4ed8,#0284c7)}
        .btn-purple{background:linear-gradient(135deg,#7c3aed,#c026d3);box-shadow:0 5px 14px rgba(126,34,206,.24)}
        .btn-purple:hover{background:linear-gradient(135deg,#6d28d9,#a21caf)}

        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:767px){

            .main-content{margin-left:0;width:100%;min-width:0;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

            .mobile-header{background:linear-gradient(135deg,#0f3d91,#2563eb 65%,#38bdf8) !important;border-bottom-color:#60a5fa !important;box-shadow:0 5px 18px rgba(30,64,175,.22)}

            .stat-card{padding:18px}

            .dashboard-stats-grid .stat-card .text-2xl{font-size:18px;line-height:1.25;overflow-wrap:anywhere}

            .data-table{min-width:720px}

            .data-table td{padding:12px}
            .overflow-x-auto{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
            .modal-overlay{padding:12px;align-items:center}
            .modal-box{width:100%;max-width:560px;max-height:min(88dvh,720px);border-radius:16px;padding:0;overflow:hidden}
            .modal-header{margin:0;padding:15px 16px;width:100%;max-width:none !important}
            .modal-body{padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
            .modal-box .grid,.modal-box .flex,.modal-box .smart-dropdown,.modal-box input,.modal-box select,.modal-box textarea{min-width:0;max-width:100%}

            .modal-box .date-input-row{overflow:hidden}
            .modal-box input[type="date"]{display:block;box-sizing:border-box;width:100% !important;min-width:0 !important;max-width:100% !important;inline-size:-webkit-fill-available;min-inline-size:0 !important;max-inline-size:100% !important;-webkit-appearance:none;appearance:none}
            .modal-box input[type="date"]::-webkit-date-and-time-value{display:block;width:100%;min-width:0;max-width:100%;text-align:left;overflow:hidden}
            .modal-box p,.modal-box div{overflow-wrap:anywhere}
            .modal-box h2{font-size:18px;line-height:1.25;padding-right:8px}
            .modal-box .flex.gap-3.pt-2{flex-direction:column}
            .modal-box .flex.gap-3.pt-2>button{width:100%;flex:none;justify-content:center}
            .modal-box .flex.items-center.gap-2:has(>input.form-input){display:grid;grid-template-columns:minmax(0,1fr) 40px;width:100%}

            .modal-box .flex.items-center.gap-2:has(>input.form-input)>input.form-input[style]{grid-column:1;width:100% !important}

            .smart-dropdown-list{position:absolute;left:0;right:0;top:calc(100% + 4px);bottom:auto;max-height:min(220px,40dvh);z-index:10000}
            .update-input-row{flex-direction:column}
            .update-input-row button{min-height:44px}
        }
        @media(max-width:420px){
            .page-header{padding:12px}
            .main-content>div>div.p-6{padding:12px}
            .grid.grid-cols-2.lg\:grid-cols-4{grid-template-columns:1fr}
            .bg-white.rounded-2xl.border.p-5{padding:16px}
        }
        .mobile-header{display:none}

        /* Update panel inside modal */
        .update-input-row{display:flex;gap:8px;margin-top:10px}
        .update-input-row input{flex:1;padding:9px 13px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;color:#1e293b}
        .update-input-row input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,0.12)}
        .update-input-row button{padding:9px 16px;background:#f59e0b;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
        .update-input-row button:hover{background:#d97706}
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const SUPABASE_URL = (window.SUPABASE_URL || '').replace(/\/+$/, '');
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';
const supabase = SUPABASE_URL && SUPABASE_ANON_KEY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const icons = {
    dashboard:'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',
    orders:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z',
    progress:'M13 2L3 14h9l-1 8 10-12h-9l1-8z',
    check:'M20 6 9 17 4 12',
    revenue:['M12 20V10','M18 20V4','M6 20v-4'],
    package:['M16.5 9.4l-9-5.19','M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z','M3.27 6.96 12 12.01 20.73 6.96','M12 22.08V12'],
    plus:['M12 5v14','M5 12h14'],
    edit:['M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7','M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z'],
    trash:['M3 6h18','M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2','M10 11v6','M14 11v6'],
    x:['M18 6 6 18','M6 6l12 12'],
    eye:['M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z','M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'],
    file:['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z','M14 2v6h6','M16 13H8','M16 17H8','M10 9H8 9'],
    image:['M21 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14z','M8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z','M21 15l-5-5L5 21'],
    upload:['M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4','M17 8l-5-5-5 5','M12 3v12'],
    menu:['M3 12h18','M3 6h18','M3 18h18'],
    chart:['M23 6l-9.5 9.5-5-5L1 18','M17 6h6v6'],
    dollar:['M12 1v22','M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'],
    trending:['M23 6l-9.5 9.5-5-5L1 18','M17 6h6v6'],
    update:['M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z','M15 5l4 4'],
    search:['M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z','M21 21l-4.35-4.35'],
    chevDown:'M6 9l6 6 6-6',
    warn:'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z',
    info:['M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z','M12 8h.01','M11 12h1v4h1'],
    phone:'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z',
    send:['M22 2L11 13','M22 2L15 22 11 13 2 9l20-7z'],
};

const SvgIcon = ({name,size=30,className='',style={}}) => {
    const d = icons[name];
    if (!d) return null;
    return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
            strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
            {Array.isArray(d) ? d.map((p,i)=><path key={i} d={p}/>) : <path d={d}/>}
        </svg>
    );
};

function ActionBtn({icon,color,bg,title,onClick}) {
    return (
        <button title={title} onClick={e=>{e.stopPropagation();onClick&&onClick(e)}}
            className="p-1.5 rounded-lg transition-all hover:scale-110"
            style={{color,background:'transparent'}}
            onMouseEnter={e=>e.currentTarget.style.background=bg}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <SvgIcon name={icon} size={14}/>
        </button>
    );
}

// ── SmartDropdown ─────────────────────────────────────────────────────────────
function SmartDropdown({value,onChange,options,placeholder,onAddNew,addNewLabel,className=''}) {
    const [open,setOpen]=useState(false);
    const [search,setSearch]=useState('');
    const ref=useRef(null);
    useEffect(()=>{
        const h=(e)=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
        document.addEventListener('mousedown',h);
        return()=>document.removeEventListener('mousedown',h);
    },[]);
    const filtered=options.filter(o=>(typeof o==='string'?o:o.label||o.value||'').toLowerCase().includes(search.toLowerCase()));
    const handleSelect=(opt)=>{onChange(typeof opt==='string'?opt:opt.value);setSearch('');setOpen(false)};
    return (
        <div className={`smart-dropdown ${className}`} ref={ref}>
            <div className="form-input flex items-center justify-between cursor-pointer select-none" style={{padding:'9px 14px'}}
                onClick={()=>{setOpen(!open);setSearch('')}}>
                <span className={value?'text-slate-800':'text-slate-400'} style={{fontSize:14}}>{value||placeholder}</span>
                <SvgIcon name="chevDown" size={16} className="text-slate-400 flex-shrink-0"/>
            </div>
            {open&&(
                <div className="smart-dropdown-list">
                    <div style={{padding:'8px 10px',borderBottom:'1px solid #f1f5f9'}}>
                        <input className="form-input" style={{padding:'6px 10px',fontSize:13}} placeholder="Search..."
                            value={search} onChange={e=>setSearch(e.target.value)}
                            autoFocus={window.innerWidth>=768} onClick={e=>e.stopPropagation()}/>
                    </div>
                    {filtered.length===0&&<div className="smart-dropdown-item" style={{color:'#94a3b8',fontStyle:'italic'}}>No results found</div>}
                    {filtered.map((opt,i)=>{
                        const label=typeof opt==='string'?opt:opt.label||opt.value;
                        return <div key={i} className="smart-dropdown-item" onClick={()=>handleSelect(opt)}>{label}</div>;
                    })}
                    {onAddNew&&(
                        <div className="smart-dropdown-item add-new" onClick={()=>{setOpen(false);onAddNew(search)}}>
                            <SvgIcon name="plus" size={14}/>{addNewLabel||'Add new...'}
                        </div>
                    )}
                </div>
            )}
        </div>
    );
}

// ── CustomerSearchDropdown — live Supabase search ───────────────────────────
// Uses the browser-side Supabase client directly and does not call a localhost PHP API.
function CustomerSearchDropdown({value, onSelect, onAddNew, supabaseClient, className=''}) {
    const [open, setOpen]       = useState(false);
    const [search, setSearch]   = useState('');
    const [results, setResults] = useState([]);
    const [loading, setLoading] = useState(false);
    const ref      = useRef(null);
    const timerRef = useRef(null);

    useEffect(()=>{
        const h=(e)=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
        document.addEventListener('mousedown',h);
        return()=>document.removeEventListener('mousedown',h);
    },[]);

    useEffect(()=>{
        if(!open || !supabaseClient) return;
        clearTimeout(timerRef.current);
        timerRef.current = setTimeout(async()=>{
            setLoading(true);
            try {
                let query = supabaseClient
                    .from('repair_orders')
                    .select('customer_name, phone, email')
                    .not('customer_name', 'is', null)
                    .neq('customer_name', '');

                if (search) {
                    query = query.ilike('customer_name', `%${search}%`);
                }

                const { data, error } = await query
                    .order('created_at', { ascending: false })
                    .limit(1000);
                if (error) throw error;

                const customerMap=(data || []).reduce((map,row)=>{
                    const name=String(row.customer_name||'').trim();
                    const key=name.toLocaleLowerCase();
                    if(name&&!map.has(key))map.set(key,{...row,customer_name:name});
                    return map;
                },new Map());
                const unique=[...customerMap.values()].sort((a,b)=>a.customer_name.localeCompare(b.customer_name));
                setResults(unique);
            } catch {
                setResults([]);
            }
            setLoading(false);
        }, 300);
        return()=>clearTimeout(timerRef.current);
    },[search, open, supabaseClient]);

    const handleOpen=()=>{ setOpen(true); setSearch(''); setResults([]); };

    const handleSelect=(row)=>{ onSelect(row); setOpen(false); setSearch(''); };

    return (
        <div className={`smart-dropdown ${className}`} ref={ref}>
            <div className="form-input flex items-center justify-between cursor-pointer select-none"
                style={{padding:'9px 14px'}} onClick={handleOpen}>
                <span className={value?'text-slate-800':'text-slate-400'} style={{fontSize:14}}>
                    {value||'Select or search customer name'}
                </span>
                <SvgIcon name="chevDown" size={16} className="text-slate-400 flex-shrink-0"/>
            </div>
            {open&&(
                <div className="smart-dropdown-list">
                    <div style={{padding:'8px 10px',borderBottom:'1px solid #f1f5f9'}}>
                        <input className="form-input" style={{padding:'6px 10px',fontSize:13}}
                            placeholder="Type to search customers..."
                            value={search} autoFocus={window.innerWidth>=768}
                            onChange={e=>setSearch(e.target.value)}
                            onClick={e=>e.stopPropagation()}/>
                    </div>
                    {loading&&(
                        <div className="smart-dropdown-item" style={{color:'#94a3b8',justifyContent:'center',gap:6}}>
                            <div style={{width:12,height:12,border:'2px solid #cbd5e1',borderTopColor:'#3b82f6',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/>
                            Searching…
                        </div>
                    )}
                    {!loading&&results.length===0&&(
                        <div className="smart-dropdown-item" style={{color:'#94a3b8',fontStyle:'italic'}}>
                            {search?'No customers found':'Type to search…'}
                        </div>
                    )}
                    {!loading&&results.map((row,i)=>(
                        <div key={i} className="smart-dropdown-item" onClick={()=>handleSelect(row)}
                            style={{flexDirection:'column',alignItems:'flex-start',gap:1}}>
                            <span style={{fontWeight:600,color:'#1e293b'}}>{row.customer_name}</span>
                            {row.phone&&<span style={{fontSize:12,color:'#94a3b8'}}>{row.phone}</span>}
                        </div>
                    ))}
                    {onAddNew&&(
                        <div className="smart-dropdown-item add-new" onClick={()=>{setOpen(false);onAddNew(search)}}>
                            <SvgIcon name="plus" size={14}/>Add new customer…
                        </div>
                    )}
                </div>
            )}
        </div>
    );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function RepairOrderSystem() {
    const [orders,setOrders]=useState([]);
    const [spareParts,setSpareParts]=useState([]);
    const [showForm,setShowForm]=useState(false);
    const [showSparePartForm,setShowSparePartForm]=useState(false);
    const [editingOrder,setEditingOrder]=useState(null);
    const [editingSparePart,setEditingSparePart]=useState(null);
    const [viewingOrder,setViewingOrder]=useState(null);
    const [viewingImage,setViewingImage]=useState(null);
    const [viewMode,setViewMode]=useState('dashboard');
    const [filteredOrders,setFilteredOrders]=useState([]);
    const [filteredSpareParts,setFilteredSpareParts]=useState([]);
    const [searchTerm,setSearchTerm]=useState('');
    const [sparePartSearchTerm,setSparePartSearchTerm]=useState('');
    const [loading,setLoading]=useState(false);
    const [apiError,setApiError]=useState('');
    const [stats,setStats]=useState({total:0,inProgress:0,completed:0,revenue:0});
    const [inventoryStats,setInventoryStats]=useState({totalItems:0,lowStock:0,totalValue:0});
    const [revenueData,setRevenueData]=useState({daily:[],monthly:[],yearly:[]});
    const [chartPeriod,setChartPeriod]=useState('monthly');
    const [sidebarHovered,setSidebarHovered]=useState(false);
    const [mobileSidebarOpen,setMobileSidebarOpen]=useState(false);

    // ── NEW: inline update text state for the detail modal ──
    const [updateText,setUpdateText]=useState('');
    const [savingUpdate,setSavingUpdate]=useState(false);

    const chartRef=useRef(null);
    const chartInstance=useRef(null);

    // ── Customer auto-complete store ──────────────────────────────────────────
    // allCustomers: [{customer_name, phone, email}] — used for auto-fill
    const [allCustomers,setAllCustomers]=useState([]);
    const [customerOptions,setCustomerOptions]=useState([]);
    const [phoneOptions,setPhoneOptions]=useState([]);
    const [deviceOptions,setDeviceOptions]=useState([]);

    // GitHub Pages is static, so use Supabase directly from the browser.
    const API_URL = null;

    const toJsonArray = (value) => {
        if (typeof value === 'string') {
            try {
                const parsed = JSON.parse(value);
                return Array.isArray(parsed) ? parsed : [];
            } catch { return []; }
        }
        return Array.isArray(value) ? value : [];
    };

    const normalizeOrder = (row) => ({
        ...row,
        images: toJsonArray(row.images),
        componentsChanged: toJsonArray(row.components_changed),
        updates: toJsonArray(row.updates)
    });

    const normalizeSparePart = (row) => ({ ...row });

    const generateOrderNumber = async () => {
        if (!supabase) return 'CC00001';
        const { data, error } = await supabase
            .from('repair_orders')
            .select('order_number')
            .order('id', { ascending: false })
            .limit(1)
            .single();

        if (error && error.code !== 'PGRST116') throw error;
        const lastNumber = data?.order_number ? parseInt(String(data.order_number).replace(/\D/g, ''), 10) || 0 : 0;
        return `CC${String(lastNumber + 1).padStart(5, '0')}`;
    };

    const orderFormDataInitial={
        customerName:'',phone:'',email:'',device:'',issue:'',
        status:'in-progress',dateReceived:new Date().toISOString().split('T')[0],
        endDate:'',images:[],componentsChanged:[],updates:[]
    };
    const sparePartFormDataInitial={
        partNumber:'',partName:'',description:'',quantity:0,unitPrice:0,
        supplier:'',location:'',minQuantity:5,category:'Other'
    };

    const [formData,setFormData]=useState(orderFormDataInitial);
    const [sparePartFormData,setSparePartFormData]=useState(sparePartFormDataInitial);

    const navItems=[
        {id:'dashboard',label:'Dashboard',icon:'dashboard'},
        {id:'all',label:'All Orders',icon:'orders'},
        {id:'in-progress',label:'In Progress',icon:'progress'},
        {id:'completed',label:'Completed',icon:'check'},
        {id:'revenueChart',label:'Revenue Analytics',icon:'revenue'},
        {id:'inventory',label:'Spare Parts',icon:'package'},
    ];

    // ── Helpers ───────────────────────────────────────────────────────────────
    const buildDropdownsFromOrders=(parsed)=>{
        const customers=[...new Map(parsed.filter(o=>o.customer_name).map(o=>[o.customer_name,{customer_name:o.customer_name,phone:o.phone||'',email:o.email||''}])).values()];
        const names=[...new Set(customers.map(c=>c.customer_name))].sort();
        const phones=[...new Set(parsed.map(o=>o.phone).filter(Boolean))].sort();
        const devices=[...new Set(parsed.map(o=>o.device).filter(Boolean))].sort();
        setAllCustomers(customers);
        setCustomerOptions(names);
        setPhoneOptions(phones);
        setDeviceOptions(devices);
    };

    // ── Customer / Phone selection — auto-fill ────────────────────────────────
    const handleCustomerSelect=(name)=>{
        const match=allCustomers.find(c=>c.customer_name===name);
        setFormData(prev=>({...prev,customerName:name,phone:match?.phone||prev.phone,email:match?.email||prev.email}));
    };

    const handlePhoneSelect=(phone)=>{
        const match=allCustomers.find(c=>c.phone===phone);
        setFormData(prev=>({...prev,phone,customerName:match?.customer_name||prev.customerName,email:match?.email||prev.email}));
    };

    const calculateTotalCost=(components=formData.componentsChanged)=>
        (components||[]).reduce((t,c)=>t+(parseFloat(c.cost)||0),0);

    const calculateTotalInventoryValue=(parts=spareParts)=>
        parts.reduce((t,p)=>t+((parseFloat(p.quantity)||0)*(parseFloat(p.unit_price)||0)),0);

    const generateRevenueData=(orders)=>{
        const now=new Date();
        const completed=orders.filter(o=>o.status==='completed');
        const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const daily=Array.from({length:7},(_,i)=>{
            const d=new Date();d.setDate(now.getDate()-6+i);
            const ds=d.toISOString().split('T')[0];
            return{date:d.toLocaleDateString('en-US',{weekday:'short'}),fullDate:ds,
                revenue:completed.filter(o=>o.end_date===ds).reduce((t,o)=>t+(o.componentsChanged?.reduce((s,c)=>s+(parseFloat(c.cost)||0),0)||0),0)};
        });
        const monthly=Array.from({length:6},(_,i)=>{
            const d=new Date();d.setMonth(now.getMonth()-5+i);
            const yr=d.getFullYear(),mo=d.getMonth()+1;
            return{date:monthNames[d.getMonth()],monthYear:`${monthNames[d.getMonth()]} ${yr}`,
                revenue:completed.filter(o=>{if(!o.end_date)return false;const od=new Date(o.end_date);return od.getFullYear()===yr&&od.getMonth()+1===mo}).reduce((t,o)=>t+(o.componentsChanged?.reduce((s,c)=>s+(parseFloat(c.cost)||0),0)||0),0)};
        });
        const yearly=Array.from({length:3},(_,i)=>{
            const yr=now.getFullYear()-2+i;
            return{date:String(yr),revenue:completed.filter(o=>o.end_date?.startsWith(String(yr))).reduce((t,o)=>t+(o.componentsChanged?.reduce((s,c)=>s+(parseFloat(c.cost)||0),0)||0),0)};
        });
        setRevenueData({daily,monthly,yearly});
    };

    const initChart=()=>{
        if(chartInstance.current)chartInstance.current.destroy();
        const ctx=chartRef.current?.getContext('2d');
        if(!ctx)return;
        const data=revenueData[chartPeriod]||[];
        const colors={daily:['rgba(59,130,246,0.7)','rgb(59,130,246)'],monthly:['rgba(16,185,129,0.7)','rgb(16,185,129)'],yearly:['rgba(245,158,11,0.7)','rgb(245,158,11)']};
        const[bg,border]=colors[chartPeriod];
        chartInstance.current=new Chart(ctx,{
            type:'bar',
            data:{labels:data.map(d=>d.date),datasets:[{label:'Revenue (RM)',data:data.map(d=>d.revenue),backgroundColor:bg,borderColor:border,borderWidth:1,borderRadius:6}]},
            options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`RM ${c.parsed.y.toFixed(2)}`}}},
                scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.04)'},ticks:{callback:v=>'RM '+v.toFixed(0)},title:{display:true,text:'Revenue (RM)'}},x:{grid:{display:false}}}}
        });
    };

    // ── Parse orders helper ───────────────────────────────────────────────────
    const parseOrders=(rawList)=>rawList.map(o=>{
        const p={...o};
        ['images','componentsChanged','updates'].forEach(k=>{
            if(typeof p[k]==='string'){try{p[k]=JSON.parse(p[k])}catch{p[k]=[]}}
            if(!p[k])p[k]=[];
        });
        return p;
    });

    // ── API calls ─────────────────────────────────────────────────────────────
    const fetchOrders=async(status='',search='')=>{
        setLoading(true);setApiError('');
        try{
            if (!supabase) {
                throw new Error('Supabase is not configured.');
            }

            let query = supabase.from('repair_orders').select('*');
            if (status && status !== 'all') query = query.eq('status', status);
            if (search) query = query.or(`customer_name.ilike.%${search}%,device.ilike.%${search}%,order_number.ilike.%${search}%`);

            const { data, error } = await query.order('created_at', { ascending: false });
            if (error) throw error;

            const parsed = (data || []).map(normalizeOrder);
            setOrders(parsed);
            filterOrders(parsed,viewMode,searchTerm);
            generateRevenueData(parsed);
            buildDropdownsFromOrders(parsed);
        }catch(err){
            console.error(err);
            setApiError('Supabase connection failed. Check your project URL and anon key.');
        }
        setLoading(false);
    };

    // Also try get_customers for a richer customer list (includes customers not in orders list due to filters)
    const fetchCustomers=async()=>{
        try{
            if (!supabase) return;
            const { data, error } = await supabase
                .from('repair_orders')
                .select('customer_name, phone, email, device')
                .not('customer_name', 'is', null)
                .neq('customer_name', '');
            if (error) throw error;

            const customers = (data || []).map(row => ({ customer_name: row.customer_name, phone: row.phone || '', email: row.email || '' }));
            const uniqueCustomers = [...new Map(customers.map(c => [c.customer_name, c])).values()];
            const uniqueDevices = [...new Set((data || []).map(r => r.device).filter(Boolean))].sort();

            setAllCustomers(uniqueCustomers);
            setCustomerOptions([...new Set(uniqueCustomers.map(c => c.customer_name))].sort());
            setPhoneOptions([...new Set(customers.map(c => c.phone).filter(Boolean))].sort());
            setDeviceOptions(uniqueDevices);
        }catch(err){
            console.error(err);
        }
    };

    const fetchSpareParts=async(search='')=>{
        setLoading(true);setApiError('');
        try{
            if (!supabase) {
                throw new Error('Supabase is not configured.');
            }

            let query = supabase.from('spare_parts').select('*');
            if (search) query = query.or(`part_number.ilike.%${search}%,part_name.ilike.%${search}%,description.ilike.%${search}%,category.ilike.%${search}%`);

            const { data, error } = await query.order('part_name', { ascending: true });
            if (error) throw error;

            setSpareParts(data || []);
            setFilteredSpareParts(data || []);
            updateInventoryStats(data || []);
        }catch(err){
            console.error(err);
            setApiError('Supabase connection failed. Check your project URL and anon key.');
        }
        setLoading(false);
    };

    const updateInventoryStats=(parts)=>{
        setInventoryStats({totalItems:parts.length,lowStock:parts.filter(p=>parseInt(p.quantity)<=parseInt(p.min_quantity||5)).length,totalValue:calculateTotalInventoryValue(parts)});
    };

    const fetchStats=async()=>{
        try{
            if (!supabase) return;
            const { data, error } = await supabase.from('repair_orders').select('status, estimated_cost');
            if (error) throw error;

            const rows = data || [];
            const stats = {
                total: rows.length,
                inProgress: rows.filter(row => row.status === 'in-progress').length,
                completed: rows.filter(row => row.status === 'completed').length,
                revenue: rows.reduce((sum, row) => sum + (Number(row.estimated_cost) || 0), 0)
            };
            setStats(stats);
        }catch(err){
            console.error(err);
        }
    };

    const filterOrders=(list=orders,mode=viewMode,term=searchTerm)=>{
        let f=list;
        if(mode==='in-progress')f=f.filter(o=>o.status==='in-progress');
        else if(mode==='completed')f=f.filter(o=>o.status==='completed');
        if(term&&!['dashboard','revenueChart','inventory'].includes(mode)){
            f=f.filter(o=>o.customer_name?.toLowerCase().includes(term.toLowerCase())||o.device?.toLowerCase().includes(term.toLowerCase())||o.order_number?.toLowerCase().includes(term.toLowerCase()));
        }
        setFilteredOrders(f);
    };

    const filterSpareParts=(term=sparePartSearchTerm)=>{
        if(!term){setFilteredSpareParts(spareParts);return}
        setFilteredSpareParts(spareParts.filter(p=>
            p.part_number?.toLowerCase().includes(term.toLowerCase())||
            p.part_name?.toLowerCase().includes(term.toLowerCase())||
            p.description?.toLowerCase().includes(term.toLowerCase())||
            p.category?.toLowerCase().includes(term.toLowerCase())
        ));
    };

    useEffect(()=>{fetchOrders();fetchStats();fetchSpareParts();fetchCustomers();},[]);
    useEffect(()=>{if(viewMode==='revenueChart'&&revenueData[chartPeriod]?.length)initChart();},[viewMode,chartPeriod,revenueData]);
    useEffect(()=>{filterOrders(orders,viewMode,searchTerm);},[viewMode,searchTerm,orders]);
    useEffect(()=>{filterSpareParts(sparePartSearchTerm);},[sparePartSearchTerm,spareParts]);

    const handleNav=(mode)=>{
        setViewMode(mode);
        if(!['revenueChart','inventory','dashboard'].includes(mode))fetchOrders(mode==='all'?'':mode);
        setMobileSidebarOpen(false);
    };

    const saveOrder=async(data,isEdit)=>{
        setApiError('');
        try{
            if (!supabase) {
                throw new Error('Supabase is not configured.');
            }

            const safeImages = sanitizeImagesForSave(data.images || []);
            const payload = {
                customer_name: data.customerName || '',
                phone: data.phone || '',
                email: data.email || '',
                device: data.device || '',
                issue: data.issue || '',
                estimated_cost: Number(data.estimatedCost || 0),
                status: data.status || 'in-progress',
                date_received: data.dateReceived || new Date().toISOString().split('T')[0],
                end_date: data.endDate || null,
                images: JSON.stringify(safeImages),
                components_changed: JSON.stringify(data.componentsChanged || []),
                updates: JSON.stringify(data.updates || [])
            };

            if ((data.images || []).length > 0 && safeImages.length === 0) {
                setApiError('Some selected images were too large to save. The order was saved without them.');
            }

            if (isEdit) {
                const { error } = await supabase
                    .from('repair_orders')
                    .update(payload)
                    .eq('id', data.id);
                if (error) throw error;
            } else {
                const orderNumber = await generateOrderNumber();
                const { error } = await supabase.from('repair_orders').insert([{ ...payload, order_number: orderNumber }]);
                if (error) throw error;
            }

            fetchOrders();
            fetchStats();
            fetchCustomers();
            return { success: true };
        }catch(err){
            console.error(err);
            setApiError('Failed to save order. Check your Supabase settings and ensure the "repair-images" storage bucket exists.');
            return { success: false, message: 'Failed to save order.' };
        }
    };

    // ── saveOrderUpdate — optimistic UI update + persist to server ──────────
    const saveOrderUpdate=async(orderId,text)=>{
        if(!text?.trim())return{success:false};
        setSavingUpdate(true);

        const newEntry={text:text.trim(),date:new Date().toISOString(),user:'Technician'};

        setViewingOrder(prev=>{
            if(!prev||prev.id!==orderId)return prev;
            return{...prev,updates:[...(prev.updates||[]),newEntry]};
        });
        setOrders(prev=>prev.map(o=>{
            if(o.id!==orderId)return o;
            return{...o,updates:[...(o.updates||[]),newEntry]};
        }));

        try{
            if (!supabase) throw new Error('Supabase is not configured.');
            const { data: current, error: readError } = await supabase
                .from('repair_orders')
                .select('updates')
                .eq('id', orderId)
                .single();
            if (readError) throw readError;

            const currentUpdates = toJsonArray(current?.updates);
            const nextUpdates = [...currentUpdates, newEntry];
            const { error } = await supabase
                .from('repair_orders')
                .update({ updates: JSON.stringify(nextUpdates) })
                .eq('id', orderId);

            setSavingUpdate(false);
            if (error) throw error;
            return { success: true };
        }catch(err){
            setSavingUpdate(false);
            console.error('Network error saving update:',err);
            setViewingOrder(prev=>{
                if(!prev||prev.id!==orderId)return prev;
                return{...prev,updates:(prev.updates||[]).filter(u=>u!==newEntry)};
            });
            return { success: false, message: 'Network error' };
        }
    };

    const saveSparePart=async(data,isEdit)=>{
        setApiError('');
        try{
            if (!supabase) {
                throw new Error('Supabase is not configured.');
            }

            const payload = {
                part_number: data.partNumber || '',
                part_name: data.partName || '',
                description: data.description || '',
                quantity: Number(data.quantity || 0),
                unit_price: Number(data.unitPrice || 0),
                supplier: data.supplier || '',
                location: data.location || '',
                min_quantity: Number(data.minQuantity || 5),
                category: data.category || 'Other'
            };

            if (isEdit) {
                const { error } = await supabase.from('spare_parts').update(payload).eq('id', data.id);
                if (error) throw error;
            } else {
                const { error } = await supabase.from('spare_parts').insert([payload]);
                if (error) throw error;
            }

            fetchSpareParts();
            return { success: true };
        }catch(err){
            console.error(err);
            setApiError('Failed to save spare part. Check your Supabase settings.');
            return { success: false, message: 'Failed to save spare part.' };
        }
    };

    const deleteOrder=async(id)=>{
        if(!confirm('Delete this order?'))return;
        setApiError('');
        try{
            if (!supabase) throw new Error('Supabase is not configured.');
            const { error } = await supabase.from('repair_orders').delete().eq('id', id);
            if (error) throw error;
            fetchOrders();
            fetchStats();
        }catch(err){
            console.error(err);
            setApiError('Failed to delete order.');
        }
    };

    const deleteSparePart=async(id)=>{
        if(!confirm('Delete this spare part?'))return;
        setApiError('');
        try{

            canvas.width=Math.max(1, Math.round(img.width * scale));
            canvas.height=Math.max(1, Math.round(img.height * scale));
            const ctx=canvas.getContext('2d');
            if (!ctx) {
                resolve(src);
                return;
            }
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const compressed = canvas.toDataURL('image/jpeg', quality);
            resolve(compressed.length < src.length ? compressed : src);

        });
        if (error) throw new Error(`Original image upload failed: ${error.message}`);

        const { data: publicData } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);

            <div>

                        <div className="overflow-x-auto">

                                <thead><tr><th>Period</th><th>Revenue</th><th>Share</th><th>Trend</th></tr></thead>

                                    {data.map((item,i)=>{
                                        const pct=total>0?((item.revenue/total)*100).toFixed(1):0;
                                        const prev=i>0?data[i-1].revenue:0;
                                        const trend=prev>0?((item.revenue-prev)/prev*100).toFixed(1):null;
                                        return (

                                                </td>
                                                <td>{trend!==null?<span className={`text-sm font-semibold ${parseFloat(trend)>0?'text-emerald-600':parseFloat(trend)<0?'text-red-500':'text-slate-400'}`}>{parseFloat(trend)>0?'↗':parseFloat(trend)<0?'↘':'→'} {Math.abs(trend)}%</span>:<span className="text-slate-300">—</span>}</td>

                            <div>
                                <label className="form-label">Status</label>
                                <select className="form-input" value={formData.status} onChange={e=>setFormData(prev=>({...prev,status:e.target.value}))}>
                                    <option value="in-progress">In Progress</option>
                                    <option value="completed">Completed</option>
                                    <option value="Pending-Payment">Pending Payment</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>
                            </div>
                            <div>
                                <label className="form-label">Date Received</label>
                                <input className="form-input" type="date" value={formData.dateReceived} onChange={e=>setFormData(prev=>({...prev,dateReceived:e.target.value}))}/>
                            </div>
                            <div>
                                <label className="form-label">Completion Date</label>
                                <div className="date-input-row">
                                    <input className="form-input" type="date" value={formData.endDate} onChange={e=>setFormData(prev=>({...prev,endDate:e.target.value}))}/>
                                    <button type="button" className="date-clear-btn" disabled={!formData.endDate} onClick={()=>setFormData(prev=>({...prev,endDate:''}))}>Clear</button>
                                </div>
                                <p className="text-xs text-slate-400 mt-1">Required for revenue tracking</p>
                            </div>
                        </div>

                        <div>
                            <label className="form-label">Issue Description *</label>
                            <textarea className="form-input" rows="3" placeholder="Describe the problem in detail..." value={formData.issue} onChange={e=>setFormData(prev=>({...prev,issue:e.target.value}))}/>
                        </div>

                        <div>
                            <label className="form-label">Device Images</label>
                            <div className="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-blue-300 transition-colors">
                                <input type="file" accept="image/*" multiple onChange={handleImageUpload} className="hidden" id="img-upload"/>
                                <label htmlFor="img-upload" className="cursor-pointer">
                                    <div className="mx-auto w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center mb-2"><SvgIcon name="upload" size={20} className="text-blue-500"/></div>
                                    <div className="text-sm text-slate-600 font-medium">Click to upload images</div>
                                    <div className="text-xs text-slate-400 mt-1">PNG, JPG, GIF up to 5MB</div>
                                </label>
                            </div>
                            {formData.images.length>0&&(
                                <div className="grid grid-cols-3 md:grid-cols-5 gap-2 mt-3">
                                    {formData.images.map((img,i)=>(
                                        <div key={i} className="relative group aspect-square">
                                            <img src={img.data||img} alt="" className="w-full h-full object-cover rounded-lg border border-slate-200" onError={e=>{e.target.style.display='none'}}/>
                                            <button onClick={()=>{const imgs=formData.images.filter((_,j)=>j!==i);setFormData(prev=>({...prev,images:imgs}))}}
                                                className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                <SvgIcon name="x" size={10}/>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div>
                            <div className="flex items-center justify-between mb-3">
                                <label className="form-label mb-0">Components Changed</label>
                                <button className="btn-primary text-xs py-1.5 px-3" onClick={addComponent}><SvgIcon name="plus" size={14}/>Add Component</button>
                            </div>
                            {formData.componentsChanged.length>0&&(
                                <div className="space-y-2">
                                    {formData.componentsChanged.map(c=>(
                                        <div key={c.id} className="flex items-center gap-2">
                                            <input className="form-input flex-1" placeholder="Component name" value={c.name} onChange={e=>updateComponent(c.id,'name',e.target.value)}/>
                                            <input className="form-input" style={{width:130}} type="number" step="0.01" placeholder="Cost (RM)" value={c.cost} onChange={e=>updateComponent(c.id,'cost',e.target.value)}/>
                                            <button className="p-2 bg-red-50 text-red-500 rounded-lg hover:bg-red-100 flex-shrink-0" onClick={()=>removeComponent(c.id)}><SvgIcon name="trash" size={16}/></button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="bg-blue-50 rounded-xl p-4 border border-blue-100 flex items-center justify-between">
                            <div><div className="text-sm font-semibold text-blue-800">Total Cost</div><div className="text-xs text-blue-600">{formData.componentsChanged.length} component(s)</div></div>
                            <div className="text-2xl font-bold text-blue-700">RM {calculateTotalCost().toFixed(2)}</div>
                        </div>

                        <div className="flex gap-3 pt-2 border-t border-slate-100">
                            <button className="btn-primary flex-1 justify-center" onClick={handleOrderSubmit}>{editingOrder?'Update Order':'Create Order'}</button>
                            <button className="btn-secondary flex-1 justify-center" onClick={resetOrderForm}>Cancel</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        );
    };

    // ── Spare Part Form ───────────────────────────────────────────────────────
    const renderSparePartForm=()=>{
        if(!showSparePartForm)return null;
        return (
            <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)resetSparePartForm()}}>
                <div className="modal-box" style={{maxWidth:640}}>
                    <div className="modal-header flex items-center justify-between">
                        <h2 className="text-xl font-bold text-slate-800">{editingSparePart?'Edit Spare Part':'Add New Spare Part'}</h2>
                        <button className="p-2 hover:bg-slate-100 rounded-lg" onClick={resetSparePartForm}><SvgIcon name="x" size={20} className="text-slate-500"/></button>
                    </div>
                    <div className="modal-body">
                    {apiError&&<div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">{apiError}</div>}
                    <div className="space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label className="form-label">Part Number *</label><input className="form-input" placeholder="e.g., CC-SCREEN-001" value={sparePartFormData.partNumber} onChange={e=>setSparePartFormData(p=>({...p,partNumber:e.target.value}))}/></div>
                            <div><label className="form-label">Part Name *</label><input className="form-input" placeholder="e.g., iPhone 13 Screen" value={sparePartFormData.partName} onChange={e=>setSparePartFormData(p=>({...p,partName:e.target.value}))}/></div>
                            <div><label className="form-label">Category</label>
                                <select className="form-input" value={sparePartFormData.category} onChange={e=>setSparePartFormData(p=>({...p,category:e.target.value}))}>
                                    {['Screen','Battery','Camera','Charging Port','Motherboard','Speaker','Microphone','Other'].map(c=><option key={c}>{c}</option>)}
                                </select>
                            </div>
                            <div><label className="form-label">Location</label><input className="form-input" placeholder="e.g., Shelf A3" value={sparePartFormData.location} onChange={e=>setSparePartFormData(p=>({...p,location:e.target.value}))}/></div>
                            <div><label className="form-label">Quantity</label><input className="form-input" type="number" placeholder="0" value={sparePartFormData.quantity} onChange={e=>setSparePartFormData(p=>({...p,quantity:e.target.value}))}/></div>
                            <div><label className="form-label">Min Quantity</label><input className="form-input" type="number" placeholder="5" value={sparePartFormData.minQuantity} onChange={e=>setSparePartFormData(p=>({...p,minQuantity:e.target.value}))}/></div>
                            <div><label className="form-label">Unit Price (RM)</label><input className="form-input" type="number" step="0.01" placeholder="0.00" value={sparePartFormData.unitPrice} onChange={e=>setSparePartFormData(p=>({...p,unitPrice:e.target.value}))}/></div>
                            <div><label className="form-label">Supplier</label><input className="form-input" placeholder="e.g., TechParts Inc." value={sparePartFormData.supplier} onChange={e=>setSparePartFormData(p=>({...p,supplier:e.target.value}))}/></div>
                        </div>
                        <div><label className="form-label">Description</label><textarea className="form-input" rows="2" placeholder="Additional details..." value={sparePartFormData.description} onChange={e=>setSparePartFormData(p=>({...p,description:e.target.value}))}/></div>
                        <div className="bg-purple-50 rounded-xl p-4 border border-purple-100 flex items-center justify-between">
                            <div><div className="text-sm font-semibold text-purple-800">Total Value</div><div className="text-xs text-purple-600">Qty × Unit Price</div></div>
                            <div className="text-2xl font-bold text-purple-700">RM {((sparePartFormData.quantity||0)*(sparePartFormData.unitPrice||0)).toFixed(2)}</div>
                        </div>
                        <div className="flex gap-3 pt-2 border-t border-slate-100">
                            <button className="btn-purple flex-1 justify-center" onClick={handleSparePartSubmit}>{editingSparePart?'Update Part':'Add Part'}</button>
                            <button className="btn-secondary flex-1 justify-center" onClick={resetSparePartForm}>Cancel</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        );
    };

    return (
        <div className="flex min-h-screen" style={{background:'#f5f7fa'}}>
            {renderSidebar()}
            <div className={`main-content flex-1 ${sidebarHovered?'sidebar-expanded':'sidebar-collapsed'}`}>
                <div className="mobile-header sticky top-0 z-30 bg-white border-b border-slate-200 px-4 h-14 items-center justify-between">
                    <button aria-label="Open navigation" className="w-12 h-12 p-0 bg-white/90 hover:bg-white rounded-xl flex items-center justify-center" onClick={()=>setMobileSidebarOpen(true)}>
                        <img src="CIRCUITCARE_new_logo-removebg.png" alt="Open CircuitCare navigation" className="w-12 h-12 object-contain"/>
                    </button>
                    <div className="flex items-center justify-center min-w-0 px-1">
                        <span className="font-bold text-slate-800 text-base sm:text-xl whitespace-nowrap">CIRCUITCARE SYSTEM</span>
                    </div>
                    <div className="w-12"/>
                </div>
                {viewMode==='dashboard'?renderDashboard():viewMode==='revenueChart'?renderRevenueChart():viewMode==='inventory'?renderInventory():renderOrderList()}
                <div className="fixed bottom-4 right-4 md:hidden z-30 flex flex-col gap-2">
                    <button className="btn-purple p-3 rounded-full shadow-lg" onClick={()=>setShowSparePartForm(true)}><SvgIcon name="package" size={20}/></button>
                    <button className="btn-primary p-3 rounded-full shadow-lg" onClick={()=>setShowForm(true)}><SvgIcon name="plus" size={20}/></button>
                </div>
            </div>
            {renderOrderForm()}
            {renderSparePartForm()}
            {renderOrderDetail()}
            {viewingImage&&(
                <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[9999]" onClick={()=>setViewingImage(null)}>
                    <button className="absolute top-4 right-4 p-2 bg-white/20 text-white rounded-full hover:bg-white/30" onClick={()=>setViewingImage(null)}><SvgIcon name="x" size={20}/></button>
                    {viewingImage.all?.length>1&&(
                        <>
                            <button className="absolute left-4 top-1/2 -translate-y-1/2 p-2 bg-white/20 text-white rounded-full hover:bg-white/30 text-xl font-bold"
                                onClick={e=>{e.stopPropagation();const i=(viewingImage.index-1+viewingImage.all.length)%viewingImage.all.length;const img=viewingImage.all[i];setViewingImage({data:img.data||img,name:img.name||`Image ${i+1}`,all:viewingImage.all,index:i})}}>&#8249;</button>
                            <button className="absolute right-16 top-1/2 -translate-y-1/2 p-2 bg-white/20 text-white rounded-full hover:bg-white/30 text-xl font-bold"
                                onClick={e=>{e.stopPropagation();const i=(viewingImage.index+1)%viewingImage.all.length;const img=viewingImage.all[i];setViewingImage({data:img.data||img,name:img.name||`Image ${i+1}`,all:viewingImage.all,index:i})}}>&#8250;</button>
                            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 text-white/70 text-sm">{(viewingImage.index||0)+1} / {viewingImage.all.length}</div>
                        </>
                    )}
                    <img src={viewingImage.data||viewingImage} alt="" className="max-w-full max-h-[85vh] object-contain rounded-xl" onClick={e=>e.stopPropagation()}/>
                </div>
            )}
        </div>
    );
}

ReactDOM.render(<RepairOrderSystem/>, document.getElementById('root'));
</script>
</body>
</html>
